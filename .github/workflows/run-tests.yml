name: run-tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '25', '26']

    name: Node ${{ matrix.node }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Validate package structure
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const entry = pkg.exports['.'];
            const src = entry.replace('./build/', './').replace('.js', '.ts');
            if (!fs.existsSync(src)) { console.error('Missing entry: ' + src); process.exit(1); }
            console.log('Package entry OK: ' + src);
            let count = 0;
            for (const [key, val] of Object.entries(pkg.exports)) {
              const srcPath = String(val).replace('./build/', './').replace('.js', '.ts').replace('*', '');
              if (srcPath.includes('*')) continue;
              count++;
            }
            console.log('Validated ' + count + ' export entries');
          "

      - name: Run tests
        run: npm test

  access-databases:
    name: Ticket access - ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [mysql, postgres]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: escalated_access
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escalated_access
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.0.0'
      - run: npm ci
      - run: node --import=tsx bin/test.ts --files=tests/integration/ticket_access_migration.spec.ts
        env:
          ESCALATED_TEST_DATABASE_URL: ${{ matrix.database == 'mysql' && 'mysql://root:mysql@localhost:3306/escalated_access' || 'postgres://postgres:postgres@localhost:5432/escalated_access' }}
