version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    ignore:
      # Deferred: @adonisjs/assembler peers typescript ^5 || ^6.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
